name: Build Apollo-Switch

on:
  workflow_call:

jobs:

  build:

    runs-on: ubuntu-latest
    
    container:
      # image: docker://devkitpro/devkita64:20240120 // Before SDL broken audio
      image: docker://devkitpro/devkita64:latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v1
      with:
        submodules: recursive

    - name: Remove useless fonts
      run: rm -rf ./resources/font

    - name: Remove enet
      run: dkp-pacman --noconfirm -R switch-enet

#    - name: Remove ffmpeg
#      run: dkp-pacman --noconfirm -R switch-libmpv switch-ffmpeg

    - name: Run cmake
      continue-on-error: true
      run: cmake -B build/switch -DCMAKE_BUILD_TYPE=Release -DPLATFORM_SWITCH=ON -DUSE_DEKO3D=ON
    
    - name: Dirty second cmake run
      run: cmake -B build/switch -DCMAKE_BUILD_TYPE=Release -DPLATFORM_SWITCH=ON -DUSE_DEKO3D=ON

    - name: Run build
      run: make -C build/switch Apollo.nro -j8

    - name: Rename artifact 
      run: mv build/switch/Apollo.nro build/switch/Apollo-Switch.nro

    - name: Upload Apollo-Switch.nro
      uses: actions/upload-artifact@master
      with:
        name: Apollo-Switch.nro
        path: build/switch/Apollo-Switch.nro

    - name: Upload Apollo-Switch.elf
      uses: actions/upload-artifact@master
      with:
        name: Debug.elf
        path: build/switch/Apollo.elf
